openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: suno
    description: Suno template generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate-template:
    post:
      operationId: generateSunoTemplate
      tags: [suno]
      summary: Generate a Suno.ai template from a YouTube URL
      description: Fetches song metadata from YouTube and uses AI to generate a structured Suno.ai prompt template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTemplateRequest"
      responses:
        "200":
          description: Successfully generated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SunoTemplate"
        "400":
          description: Invalid YouTube URL or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /generate-variations:
    post:
      operationId: generateVariations
      tags: [suno]
      summary: Generate style/lyric variations of a template
      description: Generates 1-4 template variations in parallel, each with a different creative angle. Partial success is allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateVariationsRequest"
      responses:
        "200":
          description: Variation results (partial success allowed — see slots)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariationsResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /playlist-info:
    get:
      operationId: getPlaylistInfo
      tags: [suno]
      summary: Extract YouTube playlist item details
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: A YouTube playlist URL
      responses:
        "200":
          description: Playlist track listing (capped at 20 entries)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistInfoResponse"
        "400":
          description: Invalid playlist URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /batch:
    post:
      operationId: batchGenerate
      tags: [suno]
      summary: Batch-process multiple YouTube tracks
      description: >
        Streams progress via Server-Sent Events (text/event-stream), not a single JSON response.
        Each event's `data` field is JSON-encoded; `type: "progress"` events carry a
        BatchTrackResult, `type: "done"` marks completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchGenerateRequest"
      responses:
        "200":
          description: SSE stream of BatchTrackResult progress events
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/BatchTrackResult"
        "400":
          description: Invalid request (e.g. more than 20 URLs)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /suno/transform:
    post:
      operationId: transformTemplate
      tags: [suno]
      summary: Apply a transform preset to a style/negative prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransformTemplateRequest"
      responses:
        "200":
          description: Transformed prompt fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransformTemplateResult"
        "400":
          description: Invalid request or unknown transformId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: boolean
          description: Whether the SQLite cache/history database is reachable
        pythonValidator:
          type: boolean
          description: Whether python3 is available for field-length validation
        aiConfigured:
          type: boolean
          description: Whether an AI provider API key is configured
      required:
        - status
    ConfirmedStructureSection:
      type: object
      properties:
        label:
          type: string
        lines:
          type: array
          items:
            type: string
      required:
        - label
        - lines
    GenerateTemplateRequest:
      type: object
      properties:
        youtubeUrl:
          type: string
          description: A YouTube video URL
        manualLyrics:
          type: string
          description: Optional manually provided lyrics to use instead of fetching from APIs
        vocalGender:
          type: string
          enum: [auto, male, female, mixed, duet, "no vocals"]
          description: Preferred vocal type for the style prompt
        energyLevel:
          type: string
          enum: [auto, "very chill", chill, medium, high, intense]
          description: Energy level of the track
        era:
          type: string
          enum: [auto, "50s", "60s", "70s", "80s", "90s", "2000s", "2010s", modern]
          description: Target musical era or decade
        genreNudge:
          type: string
          description: Optional genre or style override
        genres:
          type: array
          items:
            type: string
          description: Selected genre tags to incorporate into the style prompt
        moods:
          type: array
          items:
            type: string
          description: Mood/vibe tags (e.g. Dark, Nostalgic, Euphoric)
        instruments:
          type: array
          items:
            type: string
          description: Featured instrument hints (e.g. Piano, Guitar, Synth)
        voices:
          type: array
          items:
            type: string
          description: Vocal type/technique/character tags (e.g. Tenor, Robotic Vocals, Whispering Voice)
        mode:
          type: string
          enum: [cover, inspired]
          description: Generation mode — faithful cover or creative inspiration
        tempo:
          type: string
          enum: [ballad, slow, mid, groove, uptempo, fast, hyper]
          description: Target BPM range
        excludeTags:
          type: array
          items:
            type: string
          description: Tags to explicitly exclude from the negative prompt
        variationIndex:
          type: number
          description: Which variation to generate (1 or 2)
        feedbackContext:
          type: string
          description: Learning context derived from the user's past template ratings
        isInstrumental:
          type: boolean
          description: When true, generate as a fully instrumental track — no lyrics, only structural cues
        confirmedStructure:
          type: array
          items:
            $ref: "#/components/schemas/ConfirmedStructureSection"
          description: User-confirmed lyrics structure to use as a constraint in generation
        noCache:
          type: boolean
          description: When true, bypass the template cache and always run a fresh AI generation
      required:
        - youtubeUrl
    LyricsSection:
      type: object
      properties:
        label:
          type: string
        lines:
          type: array
          items:
            type: string
        rhymeScheme:
          type: string
        sentiment:
          type: number
        isHook:
          type: boolean
        repetitionKey:
          type: string
      required:
        - label
        - lines
        - rhymeScheme
        - sentiment
        - isHook
        - repetitionKey
    LyricsStructure:
      type: object
      properties:
        sections:
          type: array
          items:
            $ref: "#/components/schemas/LyricsSection"
        hookRepetitions:
          type: number
        sentimentArc:
          type: array
          items:
            type: number
        hasTaggedStructure:
          type: boolean
        totalSections:
          type: number
        dominantScheme:
          type: string
      required:
        - sections
        - hookRepetitions
        - sentimentArc
        - hasTaggedStructure
        - totalSections
        - dominantScheme
    SuggestedDefaults:
      type: object
      properties:
        energy:
          type: string
        tempo:
          type: string
        era:
          type: string
        instrumentHints:
          type: array
          items:
            type: string
        languageGenreHint:
          type: string
        sources:
          type: object
          additionalProperties:
            type: string
      required:
        - sources
    SongFingerprint:
      type: object
      properties:
        energy:
          type: number
          minimum: 0
          maximum: 10
          description: Energy level 0–10 derived from BPM and era
        tempoFeel:
          type: number
          minimum: 0
          maximum: 10
          description: Tempo feel 0–10 (slow=0, hyper=10)
        vocalPresence:
          type: number
          minimum: 0
          maximum: 10
          description: Vocal prominence 0–10
        instrumentalComplexity:
          type: number
          minimum: 0
          maximum: 10
          description: Arrangement/production complexity 0–10
        eraAuthenticity:
          type: number
          minimum: 0
          maximum: 10
          description: How strongly era-coded the track is 0–10
        moodValence:
          type: number
          minimum: 0
          maximum: 10
          description: Emotional valence 0=dark/sad, 10=bright/happy
        genrePurity:
          type: number
          minimum: 0
          maximum: 10
          description: How purely genre-focused vs. cross-genre 0–10
        videoId:
          type: string
        songTitle:
          type: string
        artist:
          type: string
        computedAt:
          type: number
          description: Unix ms timestamp
      required:
        - energy
        - tempoFeel
        - vocalPresence
        - instrumentalComplexity
        - eraAuthenticity
        - moodValence
        - genrePurity
    AudioFeatures:
      type: object
      properties:
        bpm:
          type: number
          description: Detected tempo in beats per minute
        key:
          type: string
          description: Detected musical key (e.g. "B-flat major", "F# minor")
        timeSignature:
          type: string
          description: Detected time signature (e.g. "4/4")
        source:
          type: string
          enum: [description, getsongbpm, ai-knowledge]
          description: >
            Where this came from — "description" (parsed from the video description),
            "getsongbpm" (GetSongBPM API lookup), or "ai-knowledge" (the AI's own
            knowledge of the song, least reliable). Not measured from real audio.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Confidence in the detected value, reflecting source quality — not a measurement
      required:
        - bpm
        - key
        - timeSignature
        - source
        - confidence
    SunoTemplate:
      type: object
      properties:
        songTitle:
          type: string
        artist:
          type: string
        styleOfMusic:
          type: string
          description: Comma-separated genre and style tags for the Suno style field
        title:
          type: string
          description: Suggested title for the Suno creation
        lyrics:
          type: string
          description: Structured lyrics/metadata block with production header and Suno metatags
        negativePrompt:
          type: string
          description: Comma-separated list of things Suno should NOT generate (no spaces after commas, 90-199 chars)
        tags:
          type: array
          items:
            type: string
          description: Additional tags for mood, instruments, tempo
        lyricsStructure:
          allOf:
            - $ref: "#/components/schemas/LyricsStructure"
          description: Analyzed structure of the source lyrics
        suggestedDefaults:
          allOf:
            - $ref: "#/components/schemas/SuggestedDefaults"
          description: Smart defaults computed from BPM, era, and language data
        fromCache:
          type: boolean
          description: True when this result was served from the server-side cache
        fingerprint:
          allOf:
            - $ref: "#/components/schemas/SongFingerprint"
          description: Musical DNA fingerprint with normalized 0–10 scores
        audioFeatures:
          allOf:
            - $ref: "#/components/schemas/AudioFeatures"
          description: Detected tempo, key, and time signature (not measured from real audio — see the "source" field)
      required:
        - songTitle
        - artist
        - styleOfMusic
        - title
        - lyrics
        - negativePrompt
        - tags
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    GenerateVariationsRequest:
      allOf:
        - $ref: "#/components/schemas/GenerateTemplateRequest"
        - type: object
          properties:
            count:
              type: integer
              minimum: 1
              maximum: 4
              description: Number of variations to generate (1–4, default 2)
    VariationSlot:
      type: object
      properties:
        variationIndex:
          type: integer
          description: 1-based slot index, stable even if generation failed
        template:
          allOf:
            - $ref: "#/components/schemas/SunoTemplate"
          description: The generated template, present when the slot succeeded
        error:
          type: string
          description: Error message for this slot, present when generation failed
      required:
        - variationIndex
    VariationsResponse:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/VariationSlot"
          description: One entry per requested variation, in slot order
        variations:
          type: array
          items:
            $ref: "#/components/schemas/SunoTemplate"
          description: Successful variations only (for backwards compat)
      required:
        - slots
        - variations
    PlaylistTrack:
      type: object
      properties:
        videoId:
          type: string
        title:
          type: string
        url:
          type: string
        thumbnail:
          type: string
      required:
        - videoId
        - title
        - url
    PlaylistInfoResponse:
      type: object
      properties:
        playlistId:
          type: string
        playlistTitle:
          type: string
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistTrack"
        totalCount:
          type: integer
        capped:
          type: boolean
          description: True if the playlist was truncated to 20 entries
      required:
        - playlistId
        - tracks
        - totalCount
        - capped
    BatchGenerateRequest:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 20
          description: List of YouTube video URLs to process
        vocalGender:
          type: string
          enum: [auto, male, female, mixed, duet, "no vocals"]
        energyLevel:
          type: string
          enum: [auto, "very chill", chill, medium, high, intense]
        era:
          type: string
          enum: [auto, "50s", "60s", "70s", "80s", "90s", "2000s", "2010s", modern]
        mode:
          type: string
          enum: [cover, inspired]
        genres:
          type: array
          items:
            type: string
        moods:
          type: array
          items:
            type: string
        instruments:
          type: array
          items:
            type: string
        voices:
          type: array
          items:
            type: string
        excludeTags:
          type: array
          items:
            type: string
        genreNudge:
          type: string
      required:
        - urls
    BatchTrackResult:
      type: object
      properties:
        url:
          type: string
        videoId:
          type: string
        title:
          type: string
        thumbnail:
          type: string
        status:
          type: string
          enum: [queued, analyzing, generating, done, failed]
        template:
          $ref: "#/components/schemas/SunoTemplate"
        error:
          type: string
        index:
          type: integer
      required:
        - url
        - videoId
        - status
        - index
    TransformTemplateRequest:
      type: object
      properties:
        styleOfMusic:
          type: string
          description: Current style prompt to transform
        negativePrompt:
          type: string
          description: Current negative prompt to transform
        transformId:
          type: string
          description: ID of the transformation preset to apply
      required:
        - styleOfMusic
        - negativePrompt
        - transformId
    TransformTemplateResult:
      type: object
      properties:
        styleOfMusic:
          type: string
          description: Updated style prompt after transformation
        negativePrompt:
          type: string
          description: Updated negative prompt after transformation
      required:
        - styleOfMusic
        - negativePrompt
